name: Build & Deploy to IONOS

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      sftp_password:
        description: "IONOS SFTP password"
        required: false
        default: ""

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build
        run: pnpm build
        env:
          VITE_ANALYTICS_ENDPOINT: ${{ secrets.VITE_ANALYTICS_ENDPOINT }}
          VITE_ANALYTICS_WEBSITE_ID: ${{ secrets.VITE_ANALYTICS_WEBSITE_ID }}

      - name: Deploy to IONOS via SFTP
        env:
          SFTP_PASS: ${{ inputs.sftp_password || secrets.IONOS_SFTP_PASSWORD }}
        run: |
          sudo apt-get install -y lftp
          lftp -u a1267584,"$SFTP_PASS" sftp://50.21.180.40 -e "
            set sftp:auto-confirm yes;
            set net:timeout 60;
            mirror -R --parallel=4 --verbose dist/public/ /pepperinsalt/public/;
            bye
          "
